<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        :root {
            --gradient-1: linear-gradient(135deg, #7c3aed, #4f46e5);
            --bg-soft: #f0f2f8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-soft);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }
        [data-theme="dark"] body {
            background: #0d0f1e;
            color: #e8ecf4;
        }
        [data-theme="dark"] .card {
            background: #1a1d35;
            color: #e8ecf4;
            border-color: #2a2f4a;
        }
        [data-theme="dark"] .list-group-item {
            background: #1a1d35;
            color: #e8ecf4;
            border-color: #2a2f4a;
        }
        [data-theme="dark"] .modal-content {
            background: #1a1d35;
            color: #e8ecf4;
        }
        [data-theme="dark"] .form-control {
            background: #0d0f1e;
            color: #e8ecf4;
            border-color: #2a2f4a;
        }

        .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: var(--gradient-1);
            color: #fff;
            border: none;
        }
        .btn-gradient:hover {
            color: #fff;
            opacity: 0.9;
        }
        .task-done {
            text-decoration: line-through;
            color: #9aa5b5;
        }
        .progress-thin {
            height: 4px;
        }
        /* Hide decorative shapes on small screens (performance fix) */
        @media (max-width: 600px) {
            .decorative-shape { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand fw-bold gradient-text" href="#">
            <i class="fas fa-list-check me-1"></i> TaskFlow
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted small d-none d-sm-inline" id="dateDisplay"></span>
            <button class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger d-none" id="logoutBtn" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
</nav>

<!-- ===== MAIN CONTAINER ===== -->
<div class="container pb-5">

    <!-- Focus Card (Bootstrap Card) -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-3 d-flex align-items-center justify-content-center text-white"
                     style="width:52px;height:52px;background:var(--gradient-1);">
                    <i class="fas fa-bullseye fs-5"></i>
                </div>
                <div>
                    <div class="text-uppercase text-muted small fw-semibold">Today's Focus</div>
                    <h5 class="mb-0 fw-bold">Client-Side Todo List App</h5>
                    <small class="text-muted">
                        <i class="far fa-calendar-check"></i> Day 8 ·
                        <span id="focusPending">0</span> tasks remaining
                    </small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative" style="width:70px;height:70px;">
                    <svg width="70" height="70" viewBox="0 0 70 70" style="transform:rotate(-90deg);">
                        <circle cx="35" cy="35" r="28" stroke="#e5e7eb" stroke-width="6" fill="none" />
                        <circle cx="35" cy="35" r="28" stroke="url(#grad)" stroke-width="6"
                                stroke-linecap="round" stroke-dasharray="175.93" stroke-dashoffset="175.93"
                                id="progressRing" />
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7c3aed" />
                                <stop offset="100%" stop-color="#4f46e5" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="position-absolute top-50 start-50 translate-middle fw-bold small" id="progressPercent">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-pills mb-3 gap-2">
        <li class="nav-item">
            <button class="nav-link active" id="tabAll"><i class="fas fa-list-ul me-1"></i> All</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tabPending"><i class="far fa-clock me-1"></i> Pending</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tabDone"><i class="fas fa-check-circle me-1"></i> Done</button>
        </li>
    </ul>

    <!-- Task Section (Bootstrap Card) -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <h5 class="card-title fw-bold mb-3">
                <i class="fas fa-tasks text-primary me-2"></i> Task Implementation Steps
            </h5>

            <!-- Add Row (Bootstrap input group) -->
            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control" placeholder="Add a new task…" autocomplete="off" />
                <button class="btn btn-gradient px-4" id="addBtn">
                    <i class="fas fa-plus me-1"></i> Add
                </button>
            </div>

            <!-- Task List (Bootstrap list-group) -->
            <ul class="list-group list-group-flush mb-3" id="taskList"></ul>

            <!-- Stats (Bootstrap row) -->
            <div class="row text-center border-top pt-3 g-0">
                <div class="col-4">
                    <div class="fw-bold fs-5 gradient-text" id="totalCount">0</div>
                    <small class="text-muted">Total</small>
                </div>
                <div class="col-4 border-start border-end">
                    <div class="fw-bold fs-5 gradient-text" id="doneCount">0</div>
                    <small class="text-muted">Done</small>
                </div>
                <div class="col-4">
                    <div class="fw-bold fs-5 gradient-text" id="pendingCount">0</div>
                    <small class="text-muted">Pending</small>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress progress-thin mt-3">
                <div class="progress-bar" id="progressFill" role="progressbar" style="width:0%; background:var(--gradient-1);"></div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2">
                <button class="btn btn-outline-danger btn-sm" id="clearBtn">
                    <i class="fas fa-trash-alt me-1"></i> Clear All
                </button>
                <button class="btn btn-dark" id="reviewBtn">
                    <i class="fas fa-thumbs-up me-1"></i> I've Reviewed the Steps
                    <span class="badge bg-light text-dark ms-1" id="reviewBadge">0/0</span>
                </button>
            </div>

        </div>
    </div>

    <p class="text-center text-muted small mt-4">
        &copy; 2026 — Made with <i class="fas fa-heart text-danger"></i> by Chetana Gujare · TaskFlow
    </p>
</div>

<!-- ===== AUTH MODAL (Bootstrap Modal) ===== -->
<div class="modal fade" id="authModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold gradient-text" id="authTitle">Login</h5>
                <button type="button" class="btn-close" id="authCloseBtn" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <div class="mb-3">
                    <input type="text" id="authUsername" class="form-control" placeholder="Username" />
                </div>
                <div class="mb-3" id="emailGroup" style="display:none;">
                    <input type="email" id="authEmail" class="form-control" placeholder="Email" />
                </div>
                <div class="mb-3">
                    <input type="password" id="authPassword" class="form-control" placeholder="Password" />
                </div>
                <button class="btn btn-gradient w-100" id="authSubmit">Login</button>
                <p class="text-center mt-3 mb-0 small">
                    <span id="authSwitchText">Don't have an account?</span>
                    <a href="#" id="authSwitchLink" class="fw-semibold text-decoration-none">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
